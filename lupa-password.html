<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Lupa Kata Sandi — PRIT KOTAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="global.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body>

<nav class="navbar">
  <a href="index.html" class="navbar__brand"><span class="logo-dot"></span> PRIT KOTAS</a>
  <div class="navbar__menu">
    <a href="login.html">Kembali ke Login</a>
  </div>
</nav>

<div class="auth-wrap">
  <div class="auth-visual">
    <h1>Atur Ulang Kata Sandi.</h1>
    <p><strong>Pemulihan Akses</strong><br><br>Tautan pengaturan ulang kata sandi akan dikirimkan ke alamat email institusi Anda yang terdaftar dalam sistem.</p>
    <div style="width:90px; height:90px; border-radius:50%; background:var(--biru-lembut); display:flex; align-items:center; justify-content:center; font-size:2rem; margin-top:24px;">🔑</div>
  </div>

  <div class="auth-form-side">
    <div class="auth-box">
      <h2>Lupa Kata Sandi?</h2>
      <p class="subjudul">Masukkan email institusi Anda untuk menerima tautan reset.</p>

      <div id="alertReset" class="alert"></div>

      <form id="formReset">
        <div class="form-group">
          <label for="emailReset">Email Institusi</label>
          <input type="email" id="emailReset" required placeholder="admin@bps.go.id" />
        </div>
        <button type="submit" class="btn btn--primary btn--full" id="btnReset">Kirim Tautan Reset</button>
      </form>

      <p class="auth-footer-link">← <a href="login.html">Kembali ke Login</a></p>
    </div>
  </div>
</div>

<script type="module">
  import { kirimResetPassword } from "./auth.js";
  import { tampilkanAlert } from "./main.js";

  const form = document.getElementById("formReset");
  const btn = document.getElementById("btnReset");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    btn.textContent = "Mengirim...";

    const email = document.getElementById("emailReset").value.trim();

    try {
      await kirimResetPassword(email);
      tampilkanAlert("alertReset", "Tautan reset kata sandi telah dikirim. Silakan periksa email Anda.", "sukses");
      form.reset();
    } catch (err) {
      console.error(err);
      tampilkanAlert("alertReset", "Gagal mengirim tautan reset. Pastikan email terdaftar sebagai akun staf.", "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Kirim Tautan Reset";
    }
  });
</script>
</body>
</html>
